name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Get website files and add app info
        run: |
          set -e
          SRC=https://shamimmls942-blip.github.io/Rajshahi-Doctors
          # use files from this repo if present, otherwise download the live website
          if [ ! -f index.html ]; then curl -fsSL "$SRC/" -o index.html; fi
          for f in manifest.json sw.js icon-192.png icon-512.png; do
            if [ ! -f "$f" ]; then curl -fsSL "$SRC/$f" -o "$f" || rm -f "$f"; fi
          done
          test "$(wc -c < index.html)" -gt 100000
          grep -q "manifest" index.html
          python3 - <<'PY'
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          key = '<div class="card" style="text-align:center"><div class="mu">\u09af\u09c7\u0995\u09cb\u09a8\u09cb \u09aa\u09cd\u09b0\u09af\u09bc\u09cb\u099c\u09a8\u09c7 \u09ac\u09be \u0985\u09ad\u09bf\u09af\u09cb\u0997 \u099c\u09be\u09a8\u09be\u09a8'
          info = '<div class="card"><b>\u2139\ufe0f \u0985\u09cd\u09af\u09be\u09aa \u09b8\u09ae\u09cd\u09aa\u09b0\u09cd\u0995\u09c7</b><div class="mu" style="margin-top:8px;line-height:1.7"><div><b>\u09a8\u09be\u09ae:</b> \u09b0\u09be\u099c\u09b6\u09be\u09b9\u09c0 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0 \u09a8\u09bf\u09b0\u09cd\u09a6\u09c7\u09b6\u09bf\u0995\u09be</div><div><b>\u09b8\u0982\u09b8\u09cd\u0995\u09b0\u09a3:</b> \u09e7.\u09e6</div><div><b>\u0989\u09a6\u09cd\u09a6\u09c7\u09b6\u09cd\u09af:</b> \u09b0\u09be\u099c\u09b6\u09be\u09b9\u09c0\u09b0 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0, \u09b9\u09be\u09b8\u09aa\u09be\u09a4\u09be\u09b2, \u098f\u09ae\u09cd\u09ac\u09c1\u09b2\u09c7\u09a8\u09cd\u09b8 \u0993 \u099f\u09c7\u09b8\u09cd\u099f\u09c7\u09b0 \u09a4\u09a5\u09cd\u09af \u098f\u0995 \u099c\u09be\u09af\u09bc\u0997\u09be\u09af\u09bc \u09a6\u09c7\u0993\u09af\u09bc\u09be\u0964</div><div><b>\u09b8\u09c1\u09ac\u09bf\u09a7\u09be:</b> \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0 \u0993 \u09ac\u09bf\u09ad\u09be\u0997 \u0996\u09cb\u0981\u099c\u09be, \u09b9\u09be\u09b8\u09aa\u09be\u09a4\u09be\u09b2\u09c7\u09b0 \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997, \u099c\u09b0\u09c1\u09b0\u09bf \u098f\u09ae\u09cd\u09ac\u09c1\u09b2\u09c7\u09a8\u09cd\u09b8 \u09a8\u09ae\u09cd\u09ac\u09b0, \u099f\u09c7\u09b8\u09cd\u099f\u09c7\u09b0 \u09ae\u09c2\u09b2\u09cd\u09af \u09a4\u09be\u09b2\u09bf\u0995\u09be, \u09aa\u09cd\u09b0\u09be\u09a5\u09ae\u09bf\u0995 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be, \u09aa\u099b\u09a8\u09cd\u09a6\u09c7\u09b0 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0 \u09b8\u09c7\u09ad, \u09b2\u09be\u0987\u099f/\u09a1\u09be\u09b0\u09cd\u0995 \u09a5\u09bf\u09ae\u0964</div><div><b>\u0997\u09cb\u09aa\u09a8\u09c0\u09af\u09bc\u09a4\u09be:</b> \u0986\u09aa\u09a8\u09be\u09b0 \u09a4\u09a5\u09cd\u09af \u09b6\u09c1\u09a7\u09c1 \u0986\u09aa\u09a8\u09be\u09b0 \u09ab\u09cb\u09a8\u09c7 \u09b8\u0982\u09b0\u0995\u09cd\u09b7\u09bf\u09a4 \u09a5\u09be\u0995\u09c7\u0964</div><div><b>\u09b8\u09a4\u09b0\u09cd\u0995\u09a4\u09be:</b> \u098f\u0996\u09be\u09a8\u0995\u09be\u09b0 \u09a4\u09a5\u09cd\u09af \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09a8\u09bf\u09b0\u09cd\u09a6\u09c7\u09b6\u09a8\u09be\u09b0 \u099c\u09a8\u09cd\u09af, \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0\u09c7\u09b0 \u09aa\u09b0\u09be\u09ae\u09b0\u09cd\u09b6\u09c7\u09b0 \u09ac\u09bf\u0995\u09b2\u09cd\u09aa \u09a8\u09af\u09bc\u0964 \u099c\u09b0\u09c1\u09b0\u09bf \u0985\u09ac\u09b8\u09cd\u09a5\u09be\u09af\u09bc \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u09b9\u09be\u09b8\u09aa\u09be\u09a4\u09be\u09b2\u09c7 \u09af\u09be\u09a8 \u09ac\u09be \u09ef\u09ef\u09ef-\u098f \u0995\u09b2 \u0995\u09b0\u09c1\u09a8\u0964</div></div></div>'
          if '\u0985\u09cd\u09af\u09be\u09aa \u09b8\u09ae\u09cd\u09aa\u09b0\u09cd\u0995\u09c7' not in s and key in s:
              i = s.index(key)
              s = s[:i] + info + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
              print('app info added')
          else:
              print('app info already present or anchor not found')
          PY

      - name: Generate Android project from the website files
        run: |
          set -e
          P=android-build
          A=$P/app/src/main
          J=$A/java/com/rajshahi/doctors
          mkdir -p $J $A/assets $A/res/values

          # ---- website files -> app assets ----
          for f in *.html *.json *.js *.png *.jpg *.jpeg *.svg *.css *.webp; do
            if [ -f "$f" ]; then cp "$f" $A/assets/; fi
          done

          # ---- launcher icon (uses icon-192.png from the repo, else makes one) ----
          ICON=""
          for c in icon-192.png icon-512.png; do
            if [ -z "$ICON" ] && [ -f "$c" ]; then ICON="$c"; fi
          done
          if [ -z "$ICON" ]; then
            python3 - <<'PY'
          import zlib, struct
          W = 192
          def px(x, y):
              c = W // 2
              if (abs(x-c) <= 16 and abs(y-c) <= 56) or (abs(y-c) <= 16 and abs(x-c) <= 56):
                  return bytes((255, 255, 255))
              return bytes((10, 77, 60))
          raw = b''.join(b'\x00' + b''.join(px(x, y) for x in range(W)) for y in range(W))
          def ch(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', W, W, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b'')
          open('generated-icon.png', 'wb').write(png)
          PY
            ICON=generated-icon.png
          fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $A/res/mipmap-$d
            cp "$ICON" $A/res/mipmap-$d/ic_launcher.png
          done

          # ---- gradle files ----
          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RajshahiDoctors"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rajshahi.doctors'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.rajshahi.doctors'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          # ---- manifest + resources ----
          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">&#x9B0;&#x9BE;&#x99C;&#x9B6;&#x9BE;&#x9B9;&#x9C0; &#x9A1;&#x9BE;&#x995;&#x9CD;&#x9A4;&#x9BE;&#x9B0;</string>
          </resources>
          EOF

          cat > $A/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#0a4d3c</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:windowBackground">#ffffff</item>
              </style>
          </resources>
          EOF

          # ---- the app itself (WebView that opens the bundled website) ----
          cat > $J/MainActivity.java <<'EOF'
          package com.rajshahi.doctors;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Message;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private static final String HOST = "appassets.androidplatform.net";
              private static final String HOME = "https://" + HOST + "/assets/index.html";
              private static final int REQ_LOCATION = 77;

              private WebView web;
              private WebViewAssetLoader loader;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setUserAgentString(s.getUserAgentString() + " RajshahiDoctorsApp");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternal(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              geoCallback = callback;
                              geoOrigin = origin;
                              requestPermissions(new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                          }
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final WebView temp = new WebView(view.getContext());
                          final boolean[] done = {false};
                          temp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  if (!done[0]) {
                                      done[0] = true;
                                      handleExternal(request.getUrl());
                                  }
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, android.graphics.Bitmap favicon) {
                                  if (!done[0] && url != null && !url.equals("about:blank")) {
                                      done[0] = true;
                                      handleExternal(Uri.parse(url));
                                  }
                                  v.stopLoading();
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(temp);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(HOME);
                  }
              }

              /** Opens phone calls, SMS, maps and outside links in the right app. Returns true if handled. */
              private boolean handleExternal(Uri uri) {
                  if (uri == null) return true;
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                  if (HOST.equals(uri.getHost())) return false;
                  if (scheme.equals("about") || scheme.equals("data") || scheme.equals("blob") || scheme.equals("javascript")) {
                      return false;
                  }
                  try {
                      Intent i = new Intent(scheme.equals("tel") ? Intent.ACTION_DIAL : Intent.ACTION_VIEW, uri);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (ActivityNotFoundException ignored) {
                  }
                  return true;
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_LOCATION && geoCallback != null) {
                      boolean ok = false;
                      for (int r : grantResults) {
                          if (r == PackageManager.PERMISSION_GRANTED) ok = true;
                      }
                      geoCallback.invoke(geoOrigin, ok, false);
                      geoCallback = null;
                      geoOrigin = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        working-directory: android-build
        run: gradle assembleDebug --no-daemon

      - name: Save APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: RajshahiDoctors-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-build/app/build/outputs/apk/debug/app-debug.apk RajshahiDoctors.apk
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create latest RajshahiDoctors.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Rajshahi Doctors - Android APK" --notes "Download RajshahiDoctors.apk below and install it on your Android phone."
